  """
  Which sort of thing the source is. It fixes which id field below is read; any other is rejected
  """
  kind: KeyedBySourceKind!

  """
  (DATASET) The label dataset whose pixels are the map. Its own pixel grid is both the edge's input and its field, which is what a label mask is: the array being mapped is the array doing the mapping
  """
  dataset: ID = null

  """
  (MESH_COLLECTION) The mesh collection whose geometry carries the ids. Its own vertex space is both the edge's input and its field, exactly as a mask's grid is -- what differs is only where the id was materialised: on the geometry rows rather than in pixels, so a client that picked a surface is already holding one and samples nothing
  """
  meshCollection: ID = null

  """An optional name for the edge. Defaults to '<source> -> <table>'"""
  name: String = null

  """
  How much this dereference is actually known. Defaults to MANUAL -- someone authored it. Say VALIDATED when the ids the source carries were checked against the table's rows
  """
  validity: PlacementValidity = null
}

"""
Which kind of thing keys a table: the discriminator of `KeyedByInput`. Two members, not the six `DerivationSourceKind` carries, because a keying source has to be something whose own contents identify an object -- a mask's pixels, a collection's geometry. A lens is a selection and owns neither; a table is already in record-land, where the relation is `TableColumn.references` rather than an edge; a bare space holds nothing at all. Advertising those and refusing them at runtime would be a schema that says yes where the server says no
