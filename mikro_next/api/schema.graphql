"""
The connected component of the coordinate graph around one system: every coordinate system it relates to, and every top-level edge between them. Reachability is undirected -- an edge pointing *into* the system you started from (the edge into a physical space, say) relates to it just as much as one pointing out -- but every edge is returned in its true stored direction, so composing a path is still the client's job and still needs the inversions flagged
"""
type CoordinateGraph {
  """The coordinate system the walk started from"""
  root: CoordinateSystem!

  """
  Every coordinate system reachable from the root, the root included, ordered by ID
  """
  systems: [CoordinateSystem!]!

  """
  Every top-level edge with both endpoints in `systems`, ordered by ID. The children of a SEQUENCE / BY_DIMENSION / BIJECTION wrapper are not listed here; they hang off their wrapper
  """
  transformations: [Transformation!]!
}

"""
A discrete coordinate an annotation is pinned to, e.g. a timepoint or a channel
"""
input CoordinateInput {
  name: String!
  value: Int!
}

"""
A named coordinate space: a node in the transformation graph. Its axes are ordered, and that order is the order of the array's dimensions
"""
type CoordinateSystem {
  id: ID!
  name: String!

  """
  The system's axes, in array order (slowest-varying first). RFC-5 requires them ordered by type: time, then channel and custom types, then space
  """
  axes(filters: AxisFilter, pagination: OffsetPaginationInput): [Axis!]!

  """
  The wall-clock instant this system's time axis has its origin at: `wall_clock = epoch + t * unit`. A property of the space, not of any composition over it. Meaningful only for a unit-carrying system with a TIME axis (a shared world space); null when the clock is unanchored -- the time axis is still a perfectly composable relative coordinate
  """
  epoch: DateTime

  """
  The scenes that compose over this system as their world. A SHARED space lists every scene sharing it and outlives each of them: a scene adopts a space, never owns it, and deleting a scene never deletes the space. The inverse of `Scene.worldCoordinateSystem`
  """
  scenes(filters: SceneFilter, ordering: [SceneOrder!]! = [], pagination: OffsetPaginationInput): [Scene!]!

  """
  Provenance entries for this coordinate system: who created it, and every subsequent change
  """
  provenanceEntries(pagination: OffsetPaginationInput): [ProvenanceEntry!]!
  createdAt: DateTime!
  creator: User

  """
  The data living in this space. Empty for a pure reference frame -- a world, an atlas -- which is what a space with no residents *is*; there is no separate kind to consult. Several residents may share one space: a dataset's own pyramid levels and unsliced lenses live in its grid, and a hundred tiles acquired on one stage can be registered into one stage frame
  """
  residents: [Resident!]!

  """
  Every top-level edge landing in this space -- the claims that place something here. They belong to the space, so every scene composing over this system sees the same list, each entry unique for its data-tree, and `layers.pathToWorld` searches exactly these plus the datasets' own facts. On a shared world these are the registrations a client authored; on a container's own grid they are the lens crops and derived children that land in it. Composing the matrices stays the client's job. Not filtered by kind, so a table's own system also lists the FIELD edge of any mask keying it -- that one places nothing (a FIELD has no inverse, so no path walks it backwards); it is a dereference, and `attributePlans` is what reads it
  """
  registrations: [Transformation!]!

  """
  Every space whose data can be composed here: those with a traversable path into this one, walking the transformation edges. The same set the `placeableIn` filters answer from, so a picker and a layer mutation cannot disagree. Distinct from `coordinateGraph`, which walks the undirected *neighbourhood* -- this is directed, and asks who can get in
  """
  placedSystems: [CoordinateSystem!]!

  """
  The annotations drawn in a space that can reach this one. Reachability, not containment: an annotation belongs to a collection, and outlives every scene composing over this space. A property of the space rather than of any scene over it, which is why it hangs off the system -- ask it of a scene as `worldCoordinateSystem { annotations }`
  """
  annotations: [Annotation!]!

  """
  Which registered sources are in view of an axis-aligned region asked in *this* system's coordinates, each with its extent here, the path of edges that places it, and its in-view coordinate anchors. The field hangs off the coordinate system because the system IS the frame the region is written in -- there is no ambient world to be wrong about, and no camera: a region is a box, and projecting a frustum into one is the client's job. `region` names a leading prefix of this system's axes and says nothing about the rest, so a 2D box asked of a 4D space constrains only its first two axes. Sources the server cannot bound (a mesh collection's vertices and a table's rows live in Parquet it never opens) come back with an empty `extent` and an `extentState` saying why, rather than being culled -- refusing to bound something is not the same as knowing it is out of view. Nothing is stored: the extent is composed per request from the shapes and the edges, so refining a registration moves everything that looks through it and no cached box can disagree. Individual annotations are out of scope; selecting those needs the region pulled back into their frame, and this server composes forward only
  """
  inView(region: BoundingBoxInput!): [SourcePlacement!]!

  """
  The summed version of the transformation chain from this system down to its dataset's intrinsic pixel space, as it stands now. Compare it with an annotation's `createdWithTransforms` to detect staleness: the two agreeing means the geometry was authored against the chain still in force, and them differing means a registration or physical-space edge on the path has been refined since. 0 for a system that IS an intrinsic space, or one with no path down to pixels (a unit-carrying or shared space -- its coordinates are meaningful on their own). Provenance only: it never takes part in resolving a coordinate
  """
  transformVersion: Int!
}

"""
The fields a COORDINATE_SYSTEM derivation reads. Published for codegen; the wire type is the flat DerivedFromInput
"""
input CoordinateSystemDerivedFromInput {
  kind: DerivationSourceKind! = COORDINATE_SYSTEM
  transform: TransformInput = null
  valueRelation: ValueRelation = null
  coordinateSystem: ID!
}

input CoordinateSystemFilter {
  """Filter by list of IDs"""
  ids: [ID!]

  """Search by name (case-insensitive substring)"""
  search: String

  """Filter for items created before this datetime"""
  createdBefore: DateTime

  """Filter for items created after this datetime"""
  createdAfter: DateTime

  """Filter by the creator's subject ID"""
  owner: ID
  id: ID
  name: StrFilterLookup
  AND: CoordinateSystemFilter
  OR: CoordinateSystemFilter
  NOT: CoordinateSystemFilter
  DISTINCT: Boolean

  """
  Filter to the spaces nothing lives in: pure reference frames, the worlds and atlases sources are registered into. False finds the spaces some data actually occupies
  """
  uninhabited: Boolean

  """
  Filter to the spaces this dataset's data lives in: its own grid, and the grids of its pyramid levels and lenses
  """
  dataset: ID

  """Filter by a scene composing over this system as its world"""
  scene: ID
}

input CoordinateSystemOrder @oneOf {
  name: Ordering
  createdAt: Ordering
  id: Ordering
}

"""
The kind of a transformation a client can author directly: the discriminator of `TransformInput`. SEQUENCE and BIJECTION are absent on purpose -- they are wrappers the ingest builds together with their children (pyramid levels, stepped lenses), never authored empty.
"""
enum CreatableTransformKind {
  """
  The identity map. Input and output coordinates are the same, so it takes no parameters.
  """
  IDENTITY

  """A per-axis multiplication. Takes `scale`, one entry per input axis."""
  SCALE

  """A per-axis offset. Takes `translation`, one entry per input axis."""
  TRANSLATION

  """
  A permutation of axes, mapping each input axis to an output axis by name. Takes `inputAxes` and `outputAxes`; the matrix is synthesized from them.
  """
  MAP_AXIS

  """
  A general affine map. Takes `affine`, an M x (N+1) matrix with rows outermost.
  """
  AFFINE

  """
  A rotation. Takes `affine`: the orthonormal matrix, in the same layout an AFFINE uses.
  """
  ROTATION

  """
  A map acting on a named subset of the axes and saying nothing about the rest. Takes `inputAxes` and `outputAxes`, and optionally `scale`, `translation` or `affine` acting on the named axes.
  """
  BY_DIMENSION

  """
  A non-affine map given by the values of an array rather than by a formula. Takes `field` (the array's coordinate system), `inputAxes` and `outputAxes`.
  """
  FIELD

  """
  A declared NON-correspondence: no point of either space maps to a point of the other. Takes only an optional `reason`.
  """
  UNMAPPABLE
}

