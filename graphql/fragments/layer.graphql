fragment Layer on Layer {
  id
  scene {
    id
    name
  }
  ... on ImageLayer {
    lens {
      id
    }
  }
  ... on LabelLayer {
    lens {
      id
    }
    placement
    placementValidity
  }
  ... on MeshLayer {
    collection {
      id
      version
    }
    materialColor
    wireframe
    colorBy {
      table
      column
      colormap
      classColors
    }
    placement
    placementValidity
  }
}
