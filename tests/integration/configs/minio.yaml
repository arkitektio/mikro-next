buckets:
  - name: zarr
  - name: parquet
  - name: media
  # The server config names a fourth store (`datalayer.bigfile.bucket`), so
  # without this every from_file_like upload 404s on a bucket that never existed.
  - name: bigfile
users:
  - access_key: mikro_access_key
    name: mikronew
    policies:
      - readwrite
    secret_key: mikro_secret_key
